version: "3"

tasks:
  install_tools:
    desc: Install all dependencies for the project
    cmds:
      - chmod +x ./scripts/install-tools.sh
      - ./scripts/install-tools.sh

  sync:
    desc: Install the exact dependencies in the lockfiles (run after cloning or pulling)
    cmds:
      - cargo fetch --locked
      - pnpm install --frozen-lockfile

  upgrade:
    desc: Upgrade all dependencies to their latest versions and update the lockfiles
    cmds:
      - cargo update
      - pnpm update --latest

  run_ci:
    desc: Run the CI pipeline locally
    cmds:
      - act -n

  test:
    desc: Run tests
    cmds:
      - cargo nextest run

  test:doc:
    desc: Run doc tests (not supported by nextest)
    cmds:
      - cargo test --doc

  format:
    desc: Run formatter
    cmds:
      - cargo fmt

  lint:
    desc: Run linter
    cmds:
      - cargo clippy -- -D warnings
    deps: [format]

  security:
    desc: Run security and license checks
    cmds:
      - cargo deny check

  deadcode:
    desc: Check for dead code
    cmds:
      - cargo clippy --all-targets -- -D dead_code -D unused_imports

  unused_deps:
    desc: Check for unused dependencies
    cmds:
      - cargo machete

  build:
    desc: Build the project
    cmds:
      - cargo build
